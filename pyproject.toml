[project]
name = "kotoba-forge"
version = "0.1.0"
description = "Batch Japanese sentence cards for Anki: furigana variants, audio, and stroke order."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "isogloss-dev" }]
keywords = ["anki", "japanese", "furigana", "kanji", "flashcards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]
dependencies = [
    "sudachipy>=0.6",
    "sudachidict_core",
    "jaconv",
    "genanki",
]

[project.urls]
Homepage = "https://github.com/isogloss-dev/kotoba-forge"
Issues = "https://github.com/isogloss-dev/kotoba-forge/issues"

[project.scripts]
kotoba-forge = "jpcard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
